# Step 4 — Roll out in rings (per LOB / workflow)
workflow: intake-and-triage
lob: personal-auto

rings:
  pilot:
    enabled: true
    traffic_percent: 5
    mode: assist          # humans always commit
    channels: ["internal-desk"]

  shadow:
    enabled: true
    traffic_percent: 25
    mode: shadow         # score vs human; no writeback
    score_skills:
      - interaction-qa-scoring
      - fair-claims-checklist

  assist:
    enabled: false        # flip after shadow metrics gate
    traffic_percent: 50
    mode: assist          # draft into core; human commits
    writeback: draft_only

  automate:
    enabled: false
    traffic_percent: 10
    mode: automate
    writeback: auto_route_low_risk
    auto_route_when:
      max_severity: minor
      max_fraud_indicators: 0
      coverage_clear: true
    else: escalate_via_handoff_brief

kill_switch: false
pinned_pack_tag: main
previous_pack_tag: main
